<div class="b-menu js-sticky">
    <div class="menu-title">
        <p class="desc">Table of Contents</p>
    </div>
    <div class="menu-container">
        {% for group in project.groups %}
        <div class="menu-entry">
            <p class="desc">{{ group.title }}</p>
        </div>
        {% endfor %}
    </div>
</div>
<div class="b-content">
    <pre>{{ project | json }}</pre>

    {% for group in project.groups %}
    <div class="b-container">
        {% for element in group.elements %}
        <iframe class="draggable b-frame" draggable="true" src="database/{{project.project}}/{{element.file}}/$"
            title="Description of embedded content">
            <p>Your browser does not support iframes. You can view the content <a
                    href="database/{{project.project}}/{{element.file}}/$">here</a>.
            </p>
        </iframe>
        {% endfor %}
        <p class="draggable" draggable="true">1</p>
    </div>
    {% endfor %}
</div>
