<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Basic Reset for demonstration */
* { box-sizing: border-box; }
body { margin: 0; font-family: sans-serif; }

/* Hidden by default */
#command-palette {
    display: none;
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    max-width: 90vw;
    background: #1e1e1e; /* Dark theme base */
    color: #fff;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 1000;
    overflow: hidden;
}

/* State when shown */
#command-palette.cmdk-open {
    display: block;
    animation: fadeIn 0.1s ease-out;
}

/* Input Styling */
#cmdk-input {
    width: 100%;
    padding: 12px;
    background: #252526;
    border: none;
    color: white;
    font-size: 14px;
    outline: none;
    border-bottom: 1px solid #3e3e42;
}

/* List Styling */
.cmdk-list {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 400px;
    overflow-y: auto;
}

.cmdk-item {
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    color: #ccc;
    transition: background 0.1s;
}

.cmdk-item:hover, .cmdk-item.selected {
    background: #2d2d30;
    color: #fff;
}

.cmdk-item strong {
    color: #4fc1ff; /* Highlight command name */
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style>
</head>
<body>
    <!-- The container for the command palette -->
<div id="command-palette" class="cmdk-modal">
    <div class="cmdk-header">
        <input type="text" id="cmdk-input" placeholder="Type a command to search..." autocomplete="off" aria-label="Search commands" />
    </div>
    <div id="cmdk-results" class="cmdk-list" role="listbox" aria-label="Command list">
        <!-- Items are populated by JS -->
    </div>
</div>

<script>
    const modal = document.getElementById('command-palette');
const input = document.getElementById('cmdk-input');
const list = document.getElementById('cmdk-results');

// Dummy Data for the palette
const actions = [
    { id: 1, title: 'Open Command Palette', description: 'Ctrl + K' },
    { id: 2, title: 'Open Settings', description: 'Open app settings' },
    { id: 3, title: 'Reload Page', description: 'F5 or Command + R' },
    { id: 4, title: 'Search Google', description: 'Search online' },
    { id: 5, title: 'Clear All Filters', description: 'Reset search' },
    { id: 6, title: 'Exit Application', description: 'Close app' },
    { id: 7, title: 'About', description: 'See version info' },
    { id: 8, title: 'Documentation', description: 'Read docs' }
];

// 1. Initialize List
function renderResults(query) {
    list.innerHTML = ''; // Clear current list
    
    const filtered = actions.filter(action => 
        action.title.toLowerCase().includes(query.toLowerCase()) || 
        action.description.toLowerCase().includes(query.toLowerCase())
    );

    if (filtered.length === 0) {
        list.innerHTML = `<li class="cmdk-item" style="justify-content:center;">No results</li>`;
    }

    filtered.forEach((action, index) => {
        const li = document.createElement('li');
        li.className = 'cmdk-item';
        li.dataset.index = index;
        li.innerHTML = `<strong>${action.title}</strong> — ${action.description}`;
        list.appendChild(li);
    });
}

// 2. Handle Input Changes (Filtering)
input.addEventListener('input', (e) => {
    renderResults(e.target.value);
});

// 3. Handle Selection (Navigation)
list.addEventListener('keydown', (e) => {
    const items = document.querySelectorAll('.cmdk-item');
    let activeItem = document.querySelector('.cmdk-item.selected');

    if (!activeItem) {
        // Highlight first item on open
        if (items[0]) {
            items[0].click();
        }
        return;
    }

    const currentIdx = Array.from(items).findIndex(el => el.classList.contains('selected'));

    if (e.key === 'ArrowDown') {
        e.preventDefault();
        const nextIdx = Math.min(currentIdx + 1, items.length - 1);
        highlightItem(nextIdx);
    } 
    
    else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prevIdx = Math.max(currentIdx - 1, 0);
        highlightItem(prevIdx);
    } 
    
    else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activeItem.click(); // Trigger click event
    }
});

function highlightItem(index) {
    const items = document.querySelectorAll('.cmdk-item');
    const activeItem = document.querySelector('.cmdk-item.selected');
    
    if (activeItem) activeItem.classList.remove('selected');
    
    if (items[index]) {
        items[index].classList.add('selected');
        items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
}

// 4. Trigger Open with Shortcut
function openPalette() {
    modal.classList.add('cmdk-open');
    input.value = '';
    input.focus();
    renderResults(''); // Render all initially
}

// 5. Close on Escape
window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        if (!modal.classList.contains('cmdk-open')) {
            openPalette();
        }
    }
    if (e.key === 'Escape') {
        closeModal();
    }
});

function closeModal() {
    modal.classList.remove('cmdk-open');
    // Optional: Remove focus or move focus to previous target
    // input.blur(); 
}

// Trigger on Ctrl/Cmd + K
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        openPalette();
    }
});
</script>

</body>
</html>
