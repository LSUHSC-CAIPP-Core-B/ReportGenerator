<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Editor Example</title>

  <style>
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: white;
      background-color: #333;
    }

    .center {
      position: absolute;

      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: block;

      width: 90vw;
      height: 90vh;
      padding: 5px;
      margin: auto;
      color: black;

      background-color: white;
      border-radius: 20px;
    }

    pre {
      margin: 0;
      font-family: inherit;
    }

    .editor {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 15px;

      color: black;
      background-color: white;
      border-radius: 15px;
    }

    var {
      font-style: inherit;

      &.active {
        background-color: #3d8fdf9d;
      }
    }
  </style>

<script type="importmap">
  {
    "imports": {
      "emmet": "https://cdnjs.cloudflare.com/ajax/libs/emmet/2.4.11/emmet.es.js"
    }
  }
  </script>

  <script src="client/editor/SelectionManager.js" type="module" defer></script>
</head>
<body>

  <div class="center">
    <pre id="editor" class="editor" contenteditable="true">
Hello <s>beautiful</s> world!
This <i>test</i> <i><s>should</s> <b>be</b></i><b><i> difficult<s> to</s></i></b><s> parse</s>.
From <b>bold <i>to </b>italics</i>

<b>Bold</b>
<strong>Strong importance</strong>
<i>Italic</i>
<em>Emphasis</em>
<u>Underline</u>
<s>Strikethrough</s>
<del>Deleted text</del>
<ins>Inserted text</ins>
<mark>Highlighted text</mark>
<small>Small text</small>
<sub>Subscript</sub>
<sup>Superscript</sup>
<code>Inline code</code>
<b>Test: <kbd>Keyboard input</kbd></b>
<var>[[Variable]]</var></pre>
  </div>
</body>
</html>
